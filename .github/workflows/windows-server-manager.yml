name: Build Windows server manager
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'server/**'
      - 'tests/manager_smoke.py'
      - 'tests/windows_exe_smoke.py'
      - 'docs/SERVER_MANAGER.txt'
      - '.github/workflows/windows-server-manager.yml'
permissions:
  contents: read
env:
  PYTHONUTF8: "1"
jobs:
  windows:
    runs-on: windows-2022
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: 'x64'
      - name: Install build dependencies
        run: python -m pip install -r server/requirements-build.txt
      - name: Check existing server
        run: python tests/server_smoke.py
      - name: Check source manager
        run: python tests/manager_smoke.py
      - name: Build standalone Windows EXE
        run: python server/build_windows.py
      - name: Run packaged GUI, tray and server without Python on PATH
        run: python tests/windows_exe_smoke.py
      - name: Upload executable and checks
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: GanttServerManager-Windows-x64
          path: |
            dist/GanttServerManager.exe
            dist/GanttServerManager-Windows-x64.zip
            dist/exe-self-test.json
            dist/exe-self-test.png
            dist/manager-startup-error.log
          if-no-files-found: warn
          retention-days: 30
